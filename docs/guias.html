<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Guías | REFAX</title>
  <link rel="stylesheet" href="assets/css/estilos.css">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon-docs.svg">
  <meta name="theme-color" content="#f58220">
</head>
<body>
  <main class="page">
    <section class="page-head">
      <div>
        <div class="eyebrow">⌁ Documentación</div>
        <h1>Guías</h1>
      </div>
      <div class="page-head-actions">
        <button class="btn btn-primary admin-only" type="button" onclick="openForm()">+ Nueva guía</button>
      </div>
    </section>

    <div id="msg" hidden></div>

    <section class="panel">
      <div class="filters filters-content">
        <input id="q" class="input" placeholder="Buscar por nombre del proceso o guía...">

        <select id="areaFilter">
          <option value="">Todas las áreas</option>
        </select>

        <select id="estadoFilter">
          <option value="">Todos los estados</option>
          <option value="Activo">Activo</option>
          <option value="Critico">Crítico</option>
        </select>

        <button class="btn btn-secondary" type="button" onclick="load()">Filtrar</button>
      </div>

      <div class="table-wrap compact-table-wrap">
        <table class="table compact-table">
          <thead>
            <tr>
              <th>Guía</th>
              <th>Proceso</th>
              <th>Área</th>
              <th>Estado</th>
              <th>Archivos</th>
              <th class="admin-only-column">Acciones</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <h2 id="formTitle">Nueva guía</h2>

      <form id="form" class="form-grid">
        <input id="id" type="hidden">

        <label class="full">Proceso
          <select id="proceso_id" required></select>
        </label>

        <label class="full">Nombre
          <input id="nombre" class="input" required>
        </label>

        <label>Versión
          <input id="version" class="input">
        </label>

        <label>Estado
          <select id="estado">
            <option value="Activo">Activo</option>
            <option value="Inactivo">Inactivo</option>
          </select>
        </label>

        <label>Fecha actualización
          <input id="fecha_actualizacion" type="date" class="input">
        </label>

        <label class="full">Enlace principal
          <input id="enlace_doc" class="input">
        </label>

        <label class="full">Flujograma 1
          <input id="enlace_fluj" class="input">
        </label>

        <label class="full">Flujograma 2
          <input id="enlace_fluj1" class="input">
        </label>

        <label class="full">Flujograma 3
          <input id="enlace_fluj2" class="input">
        </label>

        <label class="full">Flujograma 4
          <input id="enlace_fluj3" class="input">
        </label>

        <div class="full toolbar">
          <button class="btn btn-primary" type="submit">Guardar</button>
          <button type="button" class="btn btn-secondary" onclick="closeForm()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    window.DOC_CATEGORY = {
      tipo: 'Guía',
      key: 'guias',
      labelPlural: 'Guías'
    };
  </script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/files-modal.js"></script>
  <script src="assets/js/categoria-documentos.js"></script>
</body>
</html>
