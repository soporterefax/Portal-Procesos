<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Procesos | REFAX</title>

  <link rel="stylesheet" href="assets/css/estilos.css">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon-docs.svg">

  <meta name="theme-color" content="#f58220">
</head>

<body>

  <main class="page">

    <!-- ===============================
         CABECERA
    ================================ -->
    <section class="page-head">

      <div>
        <div class="eyebrow">⚙️ Gestión</div>
        <h1>Procesos</h1>
      </div>

      <div class="page-head-actions">
        <button
          class="btn btn-primary admin-only"
          type="button"
          onclick="openForm()"
        >
          + Nuevo proceso
        </button>
      </div>

    </section>


    <div id="msg" hidden></div>


    <!-- ===============================
         LISTADO
    ================================ -->
    <section class="panel">

      <div class="filters filters-content">

        <input
          id="q"
          class="input"
          placeholder="Buscar por nombre del proceso..."
        >

        <select id="areaFilter">
          <option value="">Todas las áreas</option>
        </select>

        <select id="estadoFilter">
          <option value="">Todos los estados</option>
          <option value="Activo">Activo</option>
          <option value="Critico">Crítico</option>
        </select>

        <button
          class="btn btn-secondary"
          type="button"
          onclick="load()"
        >
          Filtrar
        </button>

      </div>


      <div class="table-wrap compact-table-wrap">

        <table class="table compact-table">

          <thead>
            <tr>
              <th>Proceso</th>
              <th>Área</th>
              <th>Estado</th>
              <th>Archivos</th>
              <th class="admin-only-column">Acciones</th>
            </tr>
          </thead>

          <tbody id="rows"></tbody>

        </table>

      </div>

    </section>

  </main>


  <!-- =====================================================
       MODAL CREAR / EDITAR PROCESO
  ====================================================== -->
  <div id="modal" class="modal" hidden>

    <div class="modal-card">

      <h2 id="formTitle">Nuevo proceso</h2>

      <form id="form" class="form-grid">

        <input id="id" type="hidden">


        <label>
          Código

          <input
            id="codigo"
            class="input"
            required
          >
        </label>


        <label>
          Área

          <select
            id="area_id"
            required
          ></select>
        </label>


        <label class="full">
          Nombre

          <input
            id="nombre"
            class="input"
            required
          >
        </label>


        <label>
          Tipo

          <input
            id="tipo"
            class="input"
          >
        </label>


        <label>
          Estado

          <select id="estado">
            <option value="Activo">Activo</option>
            <option value="Inactivo">Inactivo</option>
          </select>
        </label>


        <label>
          Responsable

          <input
            id="responsable"
            class="input"
          >
        </label>


        <label>
          Persona responsable

          <input
            id="persona_responsable"
            class="input"
          >
        </label>


        <label>
          Fecha actualización

          <input
            id="fecha_actualizacion"
            type="date"
            class="input"
          >
        </label>


        <label class="full">
          Objetivo

          <textarea
            id="objetivo"
            rows="3"
          ></textarea>
        </label>


        <label class="full">
          Áreas relacionadas

          <input
            id="areas_relacionadas"
            class="input"
          >
        </label>


        <label class="full">
          <input
            id="es_critico"
            type="checkbox"
            style="width:auto"
          >

          Proceso crítico
        </label>


        <div class="full toolbar">

          <button
            class="btn btn-primary"
            type="submit"
          >
            Guardar
          </button>

          <button
            type="button"
            class="btn btn-secondary"
            onclick="closeForm()"
          >
            Cancelar
          </button>

        </div>

      </form>

    </div>

  </div>


  <!-- =====================================================
       MODAL ARCHIVOS DEL PROCESO
  ====================================================== -->
  <div id="filesModal" class="modal" hidden>

    <div
      class="modal-card"
      style="max-width:850px"
    >

      <div class="panel-header">

        <div>
          <div class="eyebrow">
            📂 Archivos del proceso
          </div>

          <h2
            id="filesTitle"
            style="margin-bottom:5px"
          >
            Archivos
          </h2>

          <div
            id="filesSubtitle"
            class="muted"
          ></div>
        </div>


        <button
          type="button"
          class="btn btn-secondary btn-sm"
          onclick="closeFiles()"
        >
          Cerrar
        </button>

      </div>


      <div
        id="filesContent"
        class="quick-list"
        style="margin-top:20px"
      ></div>

    </div>

  </div>


  <!-- ===============================
       SCRIPTS
  ================================ -->

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/procesos.js"></script>

</body>

</html>
