<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Áreas | Procesos REFAX</title>
  <link rel="stylesheet" href="assets/css/estilos.css">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon-docs.svg">
  <meta name="theme-color" content="#f58220">
</head>
<body>
  <main class="page">
    <section class="page-head">
      <div>
        <h1>Áreas</h1>
        
      </div>
      <div class="page-head-actions">
        <button class="btn btn-primary admin-only" onclick="openForm()">+ Nueva área</button>
      </div>
    </section>

    <div id="msg" hidden></div>

    <section class="page-stats">
      <div class="stat-card"><div class="stat-label">Áreas visibles</div><strong id="areasCount">-</strong></div>
      <div class="stat-card"><div class="stat-label">Responsables registrados</div><strong id="areasResp">-</strong></div>
      <div class="stat-card"><div class="stat-label">Personal consignado</div><strong id="areasPersonal">-</strong></div>
      <div class="stat-card"><div class="stat-label">Procesos asociados</div><strong id="areasProc">-</strong></div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <div>
          <h3>Listado de áreas</h3>
        </div>
      </div>
      <div class="filters filters-content">
        <input id="q" class="input" placeholder="Buscar por nombre del área...">
        <select id="areaFilter"><option value="">Todas las áreas</option></select>
        <select id="estadoFilter"><option value="">Todos los estados</option><option value="Activo">Activo</option><option value="Inactivo">Inactivo</option></select>
        <button class="btn btn-secondary" onclick="load()">Filtrar</button>
      </div>
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>Código</th>
              <th>Área</th>
              <th>Responsable</th>
              <th>Procesos</th>
              <th>Estado</th>
              <th class="admin-only-column">Acciones</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <h2 id="formTitle">Nueva área</h2>
      <form id="form" class="form-grid">
        <input id="id" type="hidden">
        <label>Código<input id="codigo" class="input" required></label>
        <label>Nombre<input id="nombre" class="input" required></label>
        <label>Responsable del área<input id="responsable_area" class="input"></label>
        <label>Nombre del personal<input id="nombre_personal" class="input"></label>
        <label>Estado<select id="estado"><option value="Activo">Activo</option><option value="Inactivo">Inactivo</option></select></label>
        <label class="full">Descripción<textarea id="descripcion" class="input" rows="4"></textarea></label>
        <div class="full toolbar">
          <button class="btn btn-primary">Guardar</button>
          <button type="button" class="btn btn-secondary" onclick="closeForm()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/areas.js"></script>
</body>
</html>
